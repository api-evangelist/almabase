            application/json:
              schema:
                type: object
                properties:
                  image_type:
                    description: Type of image (e.g., 'banner', 'logo', 'gallery', 'hero').
                  image:
                    description: Image file for the event (banner, logo, gallery image, etc.).
                  image_orientation: {}
                  caption:
                    description: Caption or description for the image.
                    nullable: true
