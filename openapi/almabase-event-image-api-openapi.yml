  /api/v1/eventsx/{parent_id}/images/{pk}:
    get:
      operationId: getEventImage
      summary: Get Event Image
      description: Retrieve visual content and media galleries for events including promotional images, event photography, speaker headshots, venue photos, and marketing materials. Provides comprehensive visual content supporting event promotion, documentation, and institutional branding initiatives.
